name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  db-tests:
    name: Database integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL is installed
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql
          fi
      - name: Run schema + seed + functions + policies + assertions
        run: bash db/test/run-tests.sh

  app:
    name: App typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          # Build is static-analysis only; clients are created at request time.
          # Provide placeholders so nothing trips on missing env at build.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
